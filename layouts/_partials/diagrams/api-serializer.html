{{- $fr := eq .Lang "fr" -}}
<svg viewBox="0 0 640 210" role="img" aria-label="{{ cond $fr "Sérialisation et désérialisation avec le Serializer de Symfony" "Serialization and deserialization with the Symfony Serializer" }}">
  <defs>
    <marker id="se-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="s-arrow"/>
    </marker>
  </defs>
  {{- $boxes := slice (slice (cond $fr "Objet" "Object") "Article") (slice (cond $fr "Tableau" "Array") "['title' => …]") (slice "JSON" "{\"title\": …}") }}
  {{- range $i, $b := $boxes }}
  {{- $x := add 20 (mul $i 230) }}
  <rect x="{{ $x }}" y="70" width="140" height="62" rx="8" class="s-box" stroke-width="1.5" {{ if eq $i 1 }}style="stroke: var(--blade)"{{ end }}/>
  <text x="{{ add $x 70 }}" y="96" class="s-text" text-anchor="middle" font-weight="700">{{ index $b 0 }}</text>
  <text x="{{ add $x 70 }}" y="116" class="s-code" text-anchor="middle" font-size="11">{{ index $b 1 }}</text>
  {{- end }}
  <line x1="162" y1="84" x2="248" y2="84" class="s-line" stroke-width="1.5" marker-end="url(#se-arrow)"/>
  <line x1="392" y1="84" x2="478" y2="84" class="s-line" stroke-width="1.5" marker-end="url(#se-arrow)"/>
  <text x="205" y="62" class="s-code" text-anchor="middle">normalize</text>
  <text x="435" y="62" class="s-code" text-anchor="middle">encode</text>
  <line x1="248" y1="118" x2="162" y2="118" class="s-line" stroke-width="1.5" marker-end="url(#se-arrow)"/>
  <line x1="478" y1="118" x2="392" y2="118" class="s-line" stroke-width="1.5" marker-end="url(#se-arrow)"/>
  <text x="205" y="150" class="s-code" text-anchor="middle">denormalize</text>
  <text x="435" y="150" class="s-code" text-anchor="middle">decode</text>
  <text x="320" y="24" class="s-small" text-anchor="middle">{{ cond $fr "serialize : l'API répond (GET)  →" "serialize: the API responds (GET)  →" }}</text>
  <text x="320" y="190" class="s-small" text-anchor="middle">{{ cond $fr "←  deserialize : l'API reçoit (POST, PUT, PATCH)" "←  deserialize: the API receives (POST, PUT, PATCH)" }}</text>
  <text x="90" y="44" class="s-small" text-anchor="middle" style="fill: var(--blade)">normalizationContext</text>
  <text x="90" y="170" class="s-small" text-anchor="middle" style="fill: var(--blade)">denormalizationContext</text>
</svg>
