{{- $fr := eq .Lang "fr" -}}
<svg viewBox="0 0 640 290" role="img" aria-label="{{ cond $fr "Fork, origin et upstream : qui pousse où" "Fork, origin and upstream: who pushes where" }}">
  <defs>
    <marker id="gf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="s-arrow"/>
    </marker>
  </defs>
  <rect x="10" y="20" width="210" height="60" rx="8" class="s-box" stroke-width="1.5" style="stroke: var(--blade)"/>
  <text x="115" y="46" class="s-text" text-anchor="middle" font-weight="700">{{ cond $fr "Projet original" "Original project" }}</text>
  <text x="115" y="66" class="s-code" text-anchor="middle">upstream</text>
  <rect x="420" y="20" width="210" height="60" rx="8" class="s-box" stroke-width="1.5"/>
  <text x="525" y="46" class="s-text" text-anchor="middle" font-weight="700">{{ cond $fr "Ton fork" "Your fork" }}</text>
  <text x="525" y="66" class="s-code" text-anchor="middle">origin</text>
  <rect x="215" y="210" width="210" height="60" rx="8" class="s-box" stroke-width="1.5"/>
  <text x="320" y="236" class="s-text" text-anchor="middle" font-weight="700">{{ cond $fr "Ta machine" "Your machine" }}</text>
  <text x="320" y="256" class="s-code" text-anchor="middle">local</text>
  <g fill="none" class="s-line" stroke-width="1.5">
    <line x1="224" y1="38" x2="414" y2="38" marker-end="url(#gf-arrow)"/>
    <line x1="416" y1="64" x2="226" y2="64" marker-end="url(#gf-arrow)"/>
    <line x1="480" y1="84" x2="400" y2="204" marker-end="url(#gf-arrow)"/>
    <line x1="415" y1="206" x2="510" y2="86" marker-end="url(#gf-arrow)"/>
    <line x1="140" y1="84" x2="250" y2="204" marker-end="url(#gf-arrow)"/>
  </g>
  <text x="320" y="31" class="s-code" text-anchor="middle" font-weight="600">Fork</text>
  <text x="320" y="82" class="s-code" text-anchor="middle" font-weight="600" style="fill: var(--blade)">Pull request</text>
  <text x="400" y="130" class="s-code" text-anchor="end">git clone</text>
  <text x="482" y="170" class="s-code">git push origin</text>
  <text x="178" y="168" class="s-code" text-anchor="end">git pull upstream</text>
</svg>
