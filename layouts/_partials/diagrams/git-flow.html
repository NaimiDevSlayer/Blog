{{- $fr := eq .Lang "fr" -}}
<svg viewBox="0 0 640 240" role="img" aria-label="{{ cond $fr "Git Flow : main, hotfix, release, develop et feature" "Git Flow: main, hotfix, release, develop and feature" }}">
  {{- $lanes := slice (slice "main" 30) (slice "hotfix/*" 75) (slice "release/*" 120) (slice "develop" 165) (slice "feature/*" 210) }}
  {{- range $lanes }}
  <text x="0" y="{{ add (index . 1) 4 }}" class="s-code" font-weight="600">{{ index . 0 }}</text>
  {{- end }}
  <line x1="100" y1="30" x2="630" y2="30" style="stroke: var(--blade)" stroke-width="3"/>
  <line x1="100" y1="165" x2="630" y2="165" class="s-stroke" stroke-width="3"/>
  <g fill="none" class="s-line" stroke-width="2">
    <path d="M150,165 C165,210 170,210 185,210 L250,210 C265,210 270,165 285,165"/>
    <path d="M320,165 C335,120 340,120 355,120 L405,120 C420,120 425,30 440,30"/>
    <path d="M405,120 C420,120 425,165 440,165"/>
    <path d="M480,30 C495,75 500,75 515,75 L545,75 C560,75 565,30 580,30"/>
    <path d="M545,75 C560,75 570,165 590,165"/>
  </g>
  {{- range slice 120 440 580 }}<circle cx="{{ . }}" cy="30" r="7" class="s-gold"/>{{ end }}
  {{- range slice 150 285 320 440 590 }}<circle cx="{{ . }}" cy="165" r="6" class="s-text"/>{{ end }}
  {{- range slice 205 230 }}<circle cx="{{ . }}" cy="210" r="5" class="s-arrow"/>{{ end }}
  {{- range slice 370 395 }}<circle cx="{{ . }}" cy="120" r="5" class="s-arrow"/>{{ end }}
  <circle cx="530" cy="75" r="5" class="s-accent"/>
  <text x="440" y="16" class="s-small" text-anchor="middle">v1.0</text>
  <text x="580" y="16" class="s-small" text-anchor="middle">v1.0.1</text>
  <text x="600" y="92" class="s-small" text-anchor="middle">{{ cond $fr "urgence prod" "prod emergency" }}</text>
</svg>
