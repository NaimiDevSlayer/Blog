{{- $fr := eq .Lang "fr" -}}
<svg viewBox="0 0 640 270" role="img" aria-label="{{ cond $fr "Les entités Author, Book et Category et leurs relations" "The Author, Book and Category entities and their relationships" }}">
  {{- define "partials/diagrams/entity.html" -}}
  <rect x="{{ .x }}" y="20" width="160" height="{{ add 40 (mul (len .f) 18) }}" rx="8" class="s-box" stroke-width="1.5" {{ if .hl }}style="stroke: var(--blade)"{{ end }}/>
  <text x="{{ add .x 80 }}" y="42" class="s-text" text-anchor="middle" font-weight="700">{{ .t }}</text>
  <line x1="{{ .x }}" y1="52" x2="{{ add .x 160 }}" y2="52" class="s-muted"/>
  {{- range $i, $f := .f }}
  <text x="{{ add $.x 12 }}" y="{{ add 70 (mul $i 18) }}" class="s-code" font-size="12">{{ $f }}</text>
  {{- end }}
  {{- end -}}
  {{ partial "diagrams/entity.html" (dict "x" 0 "t" "Author" "f" (slice "firstName" "lastName" "biography" "authorSlug" "birthday")) }}
  {{ partial "diagrams/entity.html" (dict "x" 240 "t" "Book" "hl" true "f" (slice "title" "summary" "bookSlug" "isArchived" "bookFileName" "coverImageName" "author" "categories")) }}
  {{ partial "diagrams/entity.html" (dict "x" 480 "t" "Category" "f" (slice "categoryName")) }}
  <line x1="160" y1="80" x2="240" y2="80" class="s-line" stroke-width="1.5"/>
  <text x="166" y="74" class="s-gold" font-weight="700">1</text>
  <text x="234" y="74" class="s-gold" font-weight="700" text-anchor="end">N</text>
  <text x="200" y="98" class="s-code" font-size="11" text-anchor="middle">ManyToOne</text>
  <line x1="400" y1="80" x2="480" y2="80" class="s-line" stroke-width="1.5"/>
  <text x="406" y="74" class="s-gold" font-weight="700">N</text>
  <text x="474" y="74" class="s-gold" font-weight="700" text-anchor="end">N</text>
  <text x="440" y="98" class="s-code" font-size="11" text-anchor="middle">ManyToMany</text>
  <rect x="480" y="150" width="160" height="44" rx="8" class="s-box" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="560" y="177" class="s-code" text-anchor="middle" font-weight="600">book_category</text>
  <line x1="440" y1="104" x2="520" y2="150" class="s-muted" stroke-dasharray="3 3"/>
  <text x="560" y="212" class="s-small" text-anchor="middle">{{ cond $fr "table de liaison créée" "join table created" }}</text>
  <text x="560" y="228" class="s-small" text-anchor="middle">{{ cond $fr "par Doctrine" "by Doctrine" }}</text>
</svg>
