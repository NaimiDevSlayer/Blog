{{- /* Replaces PaperMod's share buttons with a single link to the YouTube channel. */ -}}
{{- $youtube := "" }}
{{- range site.Params.socialIcons }}{{ if eq .name "youtube" }}{{ $youtube = .url }}{{ end }}{{ end }}
{{- with $youtube }}
<div class="channel-follow">
    <a class="channel-follow-link" href="{{ . }}" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.6 31.6 0 0 0 0 12a31.6 31.6 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.6 31.6 0 0 0 24 12a31.6 31.6 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12l-6.2 3.6Z"/>
        </svg>
        <span>Suivre la chaîne NAIMI Dev Slayer sur YouTube</span>
    </a>
</div>
{{- end }}
