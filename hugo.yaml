baseURL: "https://naimidevslayer.com/"
defaultContentLanguage: "fr"
defaultContentLanguageInSubdir: false
title: "NAIMI Dev Slayer — Blog"
theme: "PaperMod"

pagination:
  pagerSize: 20

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

googleAnalytics: ""

minify:
  disableXML: true

params:
  env: production
  title: "NAIMI Dev Slayer"
  keywords: [Symfony, EasyAdmin, PHP, Doctrine, Tutoriels]
  author: "Naimi"
  defaultTheme: auto
  displayFullLangName: false
  disableThemeToggle: false
  ShowShareButtons: true
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true
  TocOpen: false
  comments: false

  socialIcons:
    - name: youtube
      url: "https://youtube.com/@NaimiDevSlayer"

  assets:
    disableHLJS: false

  mainSections: ["cours"]

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

languages:
  fr:
    languageName: "Français"
    languageCode: "fr-fr"
    weight: 1
    title: "NAIMI Dev Slayer — Blog"
    params:
      description: "Tutoriels Symfony, EasyAdmin et développement PHP"
      DateFormat: "2 January 2006"
      homeInfoParams:
        Title: "NAIMI Dev Slayer"
        Content: "Tutoriels pratiques sur Symfony, EasyAdmin, SQL et le développement web moderne, basés sur de vrais projets."
    menus:
      main:
        - identifier: home
          name: Accueil
          pageRef: /
          weight: 10
        - identifier: cours
          name: Cours
          pageRef: /cours
          weight: 15
        - identifier: dev-web
          parent: cours
          name: Développement web
          pageRef: /cours/developpement-web
          weight: 1
        - identifier: symfony-8
          parent: dev-web
          name: Symfony 8
          pageRef: /cours/developpement-web/symfony-8
          weight: 1
        - identifier: bases-de-donnees
          parent: cours
          name: Bases de données
          pageRef: /cours/bases-de-donnees
          weight: 2
        - identifier: mysql
          parent: bases-de-donnees
          name: MySQL
          pageRef: /cours/bases-de-donnees/mysql
          weight: 1
        - identifier: search
          name: Recherche
          pageRef: /search
          weight: 40
  en:
    languageName: "English"
    languageCode: "en-us"
    weight: 2
    title: "NAIMI Dev Slayer — Blog"
    params:
      description: "Symfony, EasyAdmin and PHP development tutorials"
      DateFormat: "January 2, 2006"
      homeInfoParams:
        Title: "NAIMI Dev Slayer"
        Content: "Hands-on tutorials on Symfony, EasyAdmin, SQL and modern web development, built around real projects."
    menus:
      main:
        - identifier: home
          name: Home
          pageRef: /
          weight: 10
        - identifier: cours
          name: Courses
          pageRef: /cours
          weight: 15
        - identifier: dev-web
          parent: cours
          name: Web development
          pageRef: /cours/developpement-web
          weight: 1
        - identifier: symfony-8
          parent: dev-web
          name: Symfony 8
          pageRef: /cours/developpement-web/symfony-8
          weight: 1
        - identifier: bases-de-donnees
          parent: cours
          name: Databases
          pageRef: /cours/bases-de-donnees
          weight: 2
        - identifier: mysql
          parent: bases-de-donnees
          name: MySQL
          pageRef: /cours/bases-de-donnees/mysql
          weight: 1
        - identifier: search
          name: Search
          pageRef: /search
          weight: 40

markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai

outputs:
  home:
    - HTML
    - RSS
    - JSON
